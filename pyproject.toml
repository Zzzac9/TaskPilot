[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskpilot"
version = "0.1.0"
description = "A general-purpose task execution agent for web and local environments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60,<0.3",
    "langgraph-checkpoint>=2.1.2,<3",
    "langgraph-checkpoint-sqlite>=2.0.11,<3",
    # checkpoint-sqlite 2.0.11 uses Connection.is_alive(), removed in 0.22.
    "aiosqlite>=0.20,<0.22",
    "langchain-openai>=0.2",
    "mcp>=2.1,<3",
    "playwright>=1.62,<2",
    "jsonschema>=4",
    "pydantic>=2",
    "fastapi>=0.141,<1",
    "uvicorn>=0.27,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
